name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/vertexfolio' }}
          NEXT_PUBLIC_PRISMIC_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_PRISMIC_ENVIRONMENT || 'vertex-folio' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://shariqahmed525.github.io/vertexfolio' }}
          NEXT_PUBLIC_EJ_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EJ_SERVICE_ID }}
          NEXT_PUBLIC_EJ_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EJ_TEMPLATE_ID }}
          NEXT_PUBLIC_EJ_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EJ_PUBLIC_KEY }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
